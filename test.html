  .tagline { font-size: 22px; font-weight: 900; color: #f0f0f0; letter-spacing: -0.3px; white-space: nowrap; text-shadow: 0 1px 4px rgba(0,0,0,0.3); }

  .subtitle { font-size: 14px; font-weight: 600; color: rgba(255,255,255,0.95); letter-spacing: 0.1px; line-height: 1.3; text-shadow: 0 1px 3px rgba(0,0,0,0.3); }
  .subtitle .nowrap { white-space: nowrap; }
  .cta {
    flex-shrink: 0; background: linear-gradient(135deg, #e85d26, #f47a3e); color: #fff;
    font-family: 'Outfit', sans-serif; font-size: 13px; font-weight: 800;
    padding: 10px 22px; border: none; border-radius: 8px; cursor: pointer;
    letter-spacing: 0.5px; text-transform: uppercase; transition: all 0.2s ease;
    box-shadow: 0 2px 12px rgba(232,93,38,0.4);
  }
  .cta:hover { background: linear-gradient(135deg, #f47a3e, #f7943e); transform: translateY(-1px); box-shadow: 0 4px 18px rgba(232,93,38,0.5); }
